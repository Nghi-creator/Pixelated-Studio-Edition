version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
      - "/apps/desktop"
      - "/services/api"
      - "/engine/runtime"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    # Routine releases must be at least seven days old; security updates are exempt.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      # First matching version-update group wins. Keep this allowlist in sync
      # with scripts/security/dependabotMergePolicy.mjs.
      npm-types-patches:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
          - "@types/qrcode"
          - "@types/cors"
          - "@types/express"
          - "@types/multer"
        update-types:
          - "patch"
      npm-production-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
