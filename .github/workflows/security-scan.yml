name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: root
            path: .
          - label: web
            path: apps/web
          - label: desktop
            path: apps/desktop
          - label: api
            path: services/api
          - label: engine-runtime
            path: engine/runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
          node-version-file: .nvmrc

      - name: Audit ${{ matrix.label }} production dependencies
        working-directory: ${{ matrix.path }}
        run: npm audit --omit=dev --audit-level=high

      - name: Check workspace lockfile consistency
        if: matrix.label == 'root'
        run: npm run check:lockfiles

      # Electron is declared as a development dependency because it is used by
      # the packager, but the resulting Electron runtime ships to users.
      - name: Audit packaged desktop runtime and build chain
        if: matrix.label == 'desktop'
        working-directory: ${{ matrix.path }}
        run: node ../../scripts/security/auditDesktopBuildChain.mjs

      - name: Audit all dependencies
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=high

  secret-pattern-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for committed secret-like tokens
        run: |
          set -euo pipefail
          if git grep -InE '(sk_live_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{35}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' -- . ':!**/package-lock.json' ':!**/.env.example'; then
            echo "::error::Potential committed secret detected. Rotate it if real, then remove it from the repository."
            exit 1
          fi

  container-image-security:
    name: Engine image security (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: libretro
            dockerfile: engine/runtime/Dockerfile
            image: pixelated-engine-libretro
          - label: native
            dockerfile: engine/runtime/Dockerfile.native
            image: pixelated-engine-native
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build final engine image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}:${{ github.sha }}
        run: docker build --pull --file "$DOCKERFILE" --tag "$IMAGE" engine/runtime

      - name: Prepare security artifact directory
        run: mkdir -p .artifacts

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: ${{ matrix.image }}-sbom-${{ github.run_id }}-${{ github.run_attempt }}.spdx.json
          format: spdx-json
          image: ${{ matrix.image }}:${{ github.sha }}
          output-file: .artifacts/${{ matrix.image }}.spdx.json

      - name: Block fixable high and critical image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          fail-build: true
          image: ${{ matrix.image }}:${{ github.sha }}
          only-fixed: true
          output-format: table
          severity-cutoff: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
