name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.label }} / Linux regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 24
            node-version-file: .nvmrc
          - label: Node 26
            node-version: 26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - name: Set up producer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install workspace dependencies
        run: npm ci
      - name: Lint, typecheck tooling and verify lockfiles
        run: npm run lint
      - name: Test every workspace and smoke helpers
        run: npm test
      - name: Build every workspace
        run: npm run build
      - name: Verify offline smoke command wiring
        run: |
          node scripts/lan/multiplayerSmoke.mjs --help
          node scripts/hosted/hostedPairingSmoke.mjs --contract-only
          npm --prefix services/api run capture:catalog-artwork -- --help

  required-quality-compatibility:
    # Preserve the existing branch-protection context. This is an aggregate
    # gate, not a Node version selection; the production lane reads .nvmrc.
    name: Node 24.18.0 / Linux regression suite
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both regression lanes to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
