name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} / Linux regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24.18.0", 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up producer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install workspace dependencies
        run: npm ci
      - name: Lint, typecheck tooling and verify lockfiles
        run: npm run lint
      - name: Test every workspace and smoke helpers
        run: npm test
      - name: Build every workspace
        run: npm run build
      - name: Verify offline smoke command wiring
        run: |
          node scripts/lan/multiplayerSmoke.mjs --help
          node scripts/hosted/hostedPairingSmoke.mjs --contract-only
          npm --prefix services/api run capture:catalog-artwork -- --help
